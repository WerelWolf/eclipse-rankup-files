
[model_options]
	#put main and off hand items after x tick to display on the body! 100 tick ~ 5 sec
	#Range: > 0
	hidetick = 200
	#Put in the name, x,y,z, x-y-z rotation values and the slot where to apply the changes 1-9, shield, banner, offhand! Separate items with a space character
	uniqueitems = "empty,0,0,0,0,0,0,0,1 potion,0,49,0,0,0,0,0,8 potion,0,10,0,0,0,0,0,7 potion,11,37,0,0,0,-25,0,1 potion,-5,15,-4,0,0,-55,0,2 ender_blaster,-50,45,0,0,90,-48,-10,8 ender_blaster,-35,-10,26,0,-90,0,-10,6 ender_blaster,39,11,0,0,90,-7,-10,7 ender_blaster,0,0,0,0,0,0,0,5 electro_gun,-30,35,5,0,0,-75,0,7 electro_gun,45,66,34,-5,180,-120,0,8 electro_gun,-40,0,15,-5,-170,0,0,5 electro_gun,-28,0,0,0,-180,0,0,6 stone_boomerang,-25,0,10,-10,100,-5,60,8 enchanted_book,-37,59,-11,0,0,0,0,9 bow,22,0,0,0,0,0,0,7 shield,0,0,0,0,0,0,0,1 minecraft_shield,0,0,0,0,0,0,0,shield minecraft:shield,0,0,0,0,0,0,0,1"
