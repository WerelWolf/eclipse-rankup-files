	#Slot 9
	s9 = true
	#Shield
	shield = true
	#Banner
	banner = true
	#main hand
	main_hand = true
	#off hand
	off_hand = true
	#quiver
	quiver = true
	#Body part attachment to a slot
	attachment = "1-body,2-body,3-body,4-body,5-body,6-body,7-body,8-body,9-body,shield-body,banner-head,offhand-lleg,quiver-body"
	#Which active slot and equipment should move the item model away
	slot_mover = "none,chest,banner;z;+_none,chest,1;z;+_none,chest;x;-_none,chest;x;-_none,chest,1,banner,shield;x;-_none,legs,4;x;+_none,chest,legs,1;z;+_none,shield;z;+_none,legs;x;-_none,quiver,offhand;z;-_none,helm;z;-_none,legs,6,4;x;+_none;z;+"
